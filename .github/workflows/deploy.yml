name: Deploy Backend to HuggingFace Spaces

# Replaces the previous AWS ECS workflow, which failed on every run: it
# referenced backend/task-definition.json, a file that has never existed in
# this repository. The deployment target is a HuggingFace Docker Space, whose
# configuration already lives in backend/README.md (sdk: docker, app_port: 8000).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  # Never let two deploys race to push the same Space.
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    name: Push backend to HF Space
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --no-cache-dir "huggingface_hub>=0.25"

      - name: Verify required secrets are present
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::HF_SPACE_ID variable is not set, e.g. 'your-user/miningniti-api'"
            exit 1
          fi

      - name: Upload backend/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="backend",
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              commit_message=f"Deploy {os.environ['GIT_SHA'][:8]} from GitHub Actions",
              # Never ship local artefacts, caches, or a developer's .env into
              # a Space — Space repos are world-readable by default.
              ignore_patterns=[
                  ".env",
                  ".env.*",
                  "venv/**",
                  "**/__pycache__/**",
                  "*.pyc",
                  ".pytest_cache/**",
                  ".mypy_cache/**",
                  "uploads/**",
                  "test.db",
                  "htmlcov/**",
                  ".coverage",
              ],
          )
          print(f"Deployed to https://huggingface.co/spaces/{os.environ['HF_SPACE_ID']}")
          PY

      - name: Summary
        run: |
          echo "### Deployed to HuggingFace Spaces :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Space: \`${{ vars.HF_SPACE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Migrations run automatically on container start (entrypoint.sh)." >> $GITHUB_STEP_SUMMARY
