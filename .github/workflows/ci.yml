name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  # Keep in step with frontend/package.json engines and frontend/.nvmrc.
  # Vercel deprecated Node 20: builds created on or after 2026-10-01 fail.
  NODE_VERSION: "24"

jobs:
  # ── Job 1: Backend Linting ────────────────────────────────────────────────────
  backend-lint:
    name: 🔍 Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install black==24.8.0 isort==5.13.0 mypy==1.11.0

      - name: Check formatting (black)
        run: black --check app/ tests/

      - name: Check imports (isort)
        run: isort --check-only app/ tests/

      - name: Type checking (mypy)
        run: |
          pip install -r requirements.txt
          mypy app/ --ignore-missing-imports --no-error-summary
        # Still non-blocking, but not for the reason stated before: mypy 1.11.0
        # reports no type errors on this project at all - it exits 2 with
        # "INTERNAL ERROR" while following an import into
        # torch/ao/quantization/utils.py. Until that crash is dealt with
        # (--follow-imports=skip for torch, or an exclude) this step proves
        # nothing, so making it blocking would only break the build.
        continue-on-error: true

  # ── Job 2: Backend Security Scan ─────────────────────────────────────────────
  backend-security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: bandit -r app/ -ll -x app/tests
        # Non-blocking: currently exits 1 on 3 medium findings in app/ - B104
        # (uvicorn binding 0.0.0.0) and two B608 hardcoded-SQL hits in the
        # hybrid-search query builder. All three are in application code, so
        # triaging them (fix, or annotate #nosec with a reason) has to happen
        # before this can gate.
        continue-on-error: true

  # ── Job 3: Backend Tests ──────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: miningniti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/miningniti_test
      # All of GEMINI/GROQ/MISTRAL/CLERK_JWKS_URL are required Settings fields:
      # anything that imports app.config raises without them. Placeholders are
      # fine because no test this workflow runs makes a real provider call:
      # every agent test injects a mock on the attribute its provider actually
      # reads (`.client` for the OpenAI-compatible ones). tests/eval/
      # test_rag_eval.py does make live LLM-judge calls and is deliberately
      # not run here.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST || 'test-api-key-placeholder' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_TEST || 'test-api-key-placeholder' }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_TEST || 'test-api-key-placeholder' }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_TEST || 'test-api-key-placeholder' }}
      CLERK_JWKS_URL: https://test.clerk.com/.well-known/jwks.json
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        # No longer continue-on-error: the chain now bootstraps a fresh
        # database (revision 001 is a real baseline), so a failure here is a
        # genuine break, not the expected state it used to be.
        run: python -m scripts.migrate

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "unit"

      # Blocking. These run against the pgvector service container above via
      # DATABASE_URL (see tests/integration/conftest.py) rather than SQLite,
      # which is what the "need real services" excuse used to be about - the
      # services have been here all along. They were non-blocking while five
      # of them failed binding PostgreSQL UUID columns under SQLite; that is
      # fixed, so a failure here is now a real failure.
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short \
            -m "integration"

      # ── Retrieval quality gate ────────────────────────────────────────────
      # Blocking. Embeddings come from a local sentence-transformers model, so
      # this needs no API keys and is deterministic. It exists because the
      # lexical half of hybrid search was returning zero rows for the entire
      # life of the feature and no test noticed.
      - name: Cache eval embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-marco-v1

      - name: Retrieval quality eval
        run: |
          pytest tests/eval/test_retrieval_metrics.py -v --tb=short -m unit
          pytest tests/eval/test_retrieval_eval.py -v -s --tb=short -m retrieval

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Job 4: Frontend Build ─────────────────────────────────────────────────────
  frontend-build:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Blocking: eslint currently reports zero problems, so this gate costs
      # nothing until someone regresses it.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.miningniti.com

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high
        # Non-blocking: 12 high-severity advisories are outstanding, all
        # transitive (sharp/libvips, postcss). Blocking here would also fail
        # the build on any newly published advisory against a pinned
        # transitive dep, with no code change - needs a triage policy first.
        continue-on-error: true

  # ── Job 5: Docker Build Validation ───────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (validate only)
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: miningniti-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
