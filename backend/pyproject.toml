[project]
name = "miningniti-backend"
version = "2.0.0"
description = "MiningNiti AI-powered mining regulatory compliance and safety backend"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.0",

    # Database & Vector Store
    "sqlalchemy>=2.0.40,<2.1.0",
    "psycopg[binary,pool]>=3.2.10",
    "psycopg2-binary>=2.9.11",
    "greenlet>=3.1.0",
    "aiosqlite>=0.21.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",

    # AI / LLM & Embeddings
    "google-generativeai>=0.8.6",
    "google-auth>=2.35.0",
    "google-api-python-client>=2.140.0",
    "openai>=1.50.0",

    # Data Processing & Local Embeddings / Reranker
    "numpy>=2.3.0",
    "scikit-learn>=1.7.0",
    "torch",
    "sentence-transformers>=3.0.0",

    # Document Parsing & OCR
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "python-magic>=0.4.27",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",

    # Caching & HTTP
    "redis>=7.1.0",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "requests>=2.32.3",
    "slowapi>=0.1.9",

    # Security & Auth
    "cryptography>=46.0.3",
    "PyJWT[crypto]>=2.9.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "tqdm>=4.66.4",

    # Production Server
    "gunicorn>=23.0.0",
    "httptools>=0.6.3",

    # Observability
    "langsmith>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "black>=26.0.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
# Avoid PEP 758 except-parentheses rewrites across existing code while running on Python 3.14.
target-version = ["py313"]
